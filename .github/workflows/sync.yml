name: Sync upstream images

# Re-hosts the official openEuler VM images as release assets of this repo,
# so the builders download them from GitHub (same cloud as the runners)
# instead of from a rate-limited upstream. See README.md for the numbers.
#
# Run this once per image set: the published release images are immutable
# (openEuler-25.09 stays openEuler-25.09), so a sync only has to be
# repeated when a NEW release/arch is added to the matrix below.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the images under"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
    - name: Create the release if it does not exist
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${{ inputs.tag }}"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "release $tag already exists, reusing it"
        else
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Re-hosted openEuler VM images (unmodified). See README.md."
        fi

  sync:
    # Serialized behind create-release so the parallel uploads below never
    # race to create the same release.
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - { release: "25.09",         arch: "x86_64" }
        - { release: "25.09",         arch: "aarch64" }
        - { release: "25.09",         arch: "riscv64" }
        - { release: "24.03-LTS-SP4", arch: "x86_64" }
        - { release: "24.03-LTS-SP4", arch: "aarch64" }
        - { release: "24.03-LTS-SP4", arch: "loongarch64" }
        - { release: "22.03-LTS-SP4", arch: "x86_64" }
        - { release: "22.03-LTS-SP4", arch: "aarch64" }
    name: ${{ matrix.release }} ${{ matrix.arch }}
    steps:
    - name: Download from upstream
      run: |
        set -e
        rel="${{ matrix.release }}"
        arch="${{ matrix.arch }}"
        file="openEuler-$rel-$arch.qcow2.xz"
        echo "$file" > .assetname

        # ONE stream, an honest User-Agent, resume on interruption.
        #
        # Deliberately NOT aria2 and NOT parallel Range requests:
        #   * mirrors.aliyun.com answers 403 to aria2's default User-Agent
        #     (and to an empty one); curl/wget/python UAs get 206.
        #   * 8 concurrent Range requests to it mostly time out -- it
        #     throttles concurrency. That is also why the builder's own
        #     8-thread download of this very file swung between 3m50s and
        #     22m11s across two runs.
        # This job runs once per image set, so slow-but-reliable wins.
        UA="anyvm-org/openeuler-archive (+https://github.com/anyvm-org/openeuler-archive)"
        got=""
        for base in \
          "https://mirrors.aliyun.com/openeuler/openEuler-$rel/virtual_machine_img/$arch" \
          "https://repo.openeuler.org/openEuler-$rel/virtual_machine_img/$arch" \
          ; do
          echo "::group::trying $base"
          expected=$(curl -sSI -A "$UA" -m 60 "$base/$file" | tr -d '\r' \
                     | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
          echo "expected size: ${expected:-unknown}"
          if [ -n "$expected" ]; then
            # Resume until the local size matches. --speed-limit aborts a
            # stalled transfer so the next attempt picks it up again,
            # instead of hanging until the job timeout.
            for attempt in 1 2 3 4 5 6; do
              have=$(stat -c%s "$file" 2>/dev/null || echo 0)
              if [ "$have" = "$expected" ]; then got="$base"; break; fi
              echo "attempt $attempt: have $have of $expected bytes"
              curl -fSL -A "$UA" -C - --speed-limit 10240 --speed-time 120 \
                -o "$file" "$base/$file" || true
            done
          fi
          echo "::endgroup::"
          if [ -n "$got" ]; then break; fi
        done
        if [ -z "$got" ]; then
          echo "could not download $file from any source"
          exit 1
        fi
        echo "downloaded from $got"
        curl -fsSL -A "$UA" --retry 5 -o "$file.sha256sum" "$got/$file.sha256sum"
        ls -lh "$file"

    - name: Verify checksum
      run: |
        set -e
        file="$(cat .assetname)"
        # Upstream ships plain `sha256sum` format, so -c validates both the
        # digest and that we fetched the file the checksum names. A silent
        # truncation (the exact failure this repo exists to avoid) fails here.
        sha256sum -c "$file.sha256sum"

    - name: Upload as a release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        file="$(cat .assetname)"
        gh release upload "${{ inputs.tag }}" "$file" "$file.sha256sum" \
          --clobber --repo "$GITHUB_REPOSITORY"
